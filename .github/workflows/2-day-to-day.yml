name: 2. Launch Kali Remote Lab

on:
  workflow_dispatch:
    inputs:
      lab_duration_hours:
        description: 'Select lab operational duration (Hours)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3', '4', '5']
      tailscale_mtu:
        description: 'Tailnet MTU for cellular links'
        required: true
        default: '1280'
        type: choice
        options: ['1280', '1360']
      client_tailnet_ip:
        description: 'Optional client Tailnet IP for path diagnostics'
        required: false
        default: ''
        type: string

jobs:
  run-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize Runner Storage
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Latest Saved State
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/cyber-lab:latest

      - name: Optimize Host Network Stack For Cellular
        run: |
          # Keep TCP window scaling enabled.
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true

          # Do not disable IPv6. Cellular carriers often provide better IPv6 paths than IPv4 paths.
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=0 || true

          # BBR/FQ helps when Tailscale falls back to TCP/DERP-style relaying or when the runner pushes large state.
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true

          # Larger socket buffers smooth bursty mobile links and reduce avoidable stalls.
          sudo sysctl -w net.core.rmem_max=134217728 || true
          sudo sysctl -w net.core.wmem_max=134217728 || true
          sudo sysctl -w net.core.rmem_default=262144 || true
          sudo sysctl -w net.core.wmem_default=262144 || true
          sudo sysctl -w net.ipv4.udp_rmem_min=8192 || true
          sudo sysctl -w net.ipv4.udp_wmem_min=8192 || true

      - name: Initialize VM-Parity Container
        run: |
          docker run -d --privileged --network host --ipc host \
            --device /dev/fuse -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --cgroupns host --security-opt apparmor=unconfined \
            --shm-size=4g --ulimit nofile=100000:100000 \
            -e TAILSCALE_AUTHKEY="${{ secrets.TAILSCALE_AUTHKEY }}" \
            -e ROOT_PASSWORD="${{ secrets.KALI_ROOT_PASSWORD }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e TAILSCALE_MTU="${{ inputs.tailscale_mtu }}" \
            -e TAILSCALE_HOSTNAME="kali-${{ github.run_id }}" \
            --name cyber-lab-container \
            ${{ secrets.DOCKER_USERNAME }}/cyber-lab:latest

      - name: Verify Container Integrity
        run: |
          sleep 8
          if [ "$(docker inspect -f '{{.State.Running}}' cyber-lab-container)" != "true" ]; then
            echo "CRITICAL: Container terminated unexpectedly."
            docker logs cyber-lab-container
            exit 1
          fi

      - name: Tailscale Path Diagnostics
        run: |
          echo "==== tailscale netcheck ===="
          docker exec cyber-lab-container tailscale netcheck || true
          echo "==== tailscale status ===="
          docker exec cyber-lab-container tailscale status || true

          CLIENT_IP="${{ inputs.client_tailnet_ip }}"
          if [ -n "$CLIENT_IP" ]; then
            echo "==== tailscale ping to client: $CLIENT_IP ===="
            docker exec cyber-lab-container tailscale ping --c 10 "$CLIENT_IP" || true
          else
            echo "No client_tailnet_ip provided; skipping direct/DERP ping test."
          fi

      - name: Telemetry Loop & Auto-Save Monitor
        run: |
          HOURS=${{ inputs.lab_duration_hours }}
          MAX_SECONDS=$((HOURS * 3600))
          START_TIME=$(date +%s)
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Timeout reached. Initiating auto-save."
              break
            fi
            if docker exec cyber-lab-container test -f /root/Desktop/close.txt; then
              echo "Signal file detected. Initiating teardown."
              break
            fi
            sleep 10
          done

      - name: Halt & Commit Fallback Matrix
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^cyber-lab-container$'; then
            docker exec cyber-lab-container rm -f /root/Desktop/close.txt || true
            docker stop -t 45 cyber-lab-container || true
            echo "Committing standard layer delta as failsafe..."
            docker commit cyber-lab-container ${{ secrets.DOCKER_USERNAME }}/cyber-lab:fallback-${{ github.run_id }}
          fi

      - name: Squash Container Filesystem
        id: squash
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if ! docker ps -a --format '{{.Names}}' | grep -q '^cyber-lab-container$'; then
            echo "Container not found; cannot export state."
            exit 1
          fi

          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/cyber-lab"
          RUN_TAG="${IMAGE_TAG}:run-${{ github.run_id }}"

          echo "Exporting flat filesystem..."
          docker export cyber-lab-container > state.tar

          echo "Generating Dockerfile configuration..."
          cat << 'EOF' > Dockerfile.squash
          FROM scratch
          ADD state.tar /
          ENV DEBIAN_FRONTEND=noninteractive
          EXPOSE 3389
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

          echo "Building zero-layer architecture..."
          docker build -f Dockerfile.squash -t "$RUN_TAG" .
          docker tag "$RUN_TAG" "${IMAGE_TAG}:latest"

      - name: Push Persistence Data (Optimal Route)
        if: ${{ always() && steps.squash.outcome == 'success' }}
        continue-on-error: true
        run: |
          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/cyber-lab"
          echo "Squash operation verified. Pushing optimized exact-state image."
          docker push "${IMAGE_TAG}:run-${{ github.run_id }}"
          docker push "${IMAGE_TAG}:latest"

      - name: Push Persistence Data (Failsafe Route)
        if: ${{ always() && steps.squash.outcome != 'success' }}
        continue-on-error: true
        run: |
          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/cyber-lab"
          echo "CRITICAL: Squash operation failed. Reverting to standard commit logic."
          docker tag "${IMAGE_TAG}:fallback-${{ github.run_id }}" "${IMAGE_TAG}:latest"
          docker push "${IMAGE_TAG}:fallback-${{ github.run_id }}"
          docker push "${IMAGE_TAG}:latest"
